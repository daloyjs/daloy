<text x="56" y="880" font-size="22" font-weight="700" fill="#1c1c1c">What this means</text>
<circle cx="68" cy="916" r="5" fill="#1c1c1c"/>
<text x="84" y="922" font-size="18" fill="#1c1c1c">AGENTS.md is what changes behaviour: with it, every attempt shipped tests (about 80% more test code). Without it, 7 of 24 shipped none.</text>
<circle cx="68" cy="956" r="5" fill="#1c1c1c"/>
<text x="84" y="962" font-size="18" fill="#1c1c1c">Without AGENTS.md, Sonnet reached for the docs MCP in 7 of 12 attempts (3 of 12 with it). It never opened the skill; GPT-6.1 Sol did in 20 of 20 runs.</text>
<circle cx="68" cy="996" r="5" fill="#1c1c1c"/>
<text x="84" y="1002" font-size="18" fill="#1c1c1c">No attempt removed a security control in any box. Keep the security rules in AGENTS.md, the one surface every agent reads.</text>
<circle cx="68" cy="1036" r="5" fill="#1c1c1c"/>
<text x="84" y="1042" font-size="18" fill="#1c1c1c">12 attempts per box is small: 92% vs 100% is a single attempt (it skipped the route test) and is within noise.</text>
