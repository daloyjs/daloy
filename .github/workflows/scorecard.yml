# OpenSSF Scorecard — continuous evaluation of the repo's security posture.
# https://github.com/ossf/scorecard
name: Scorecard

on:
  branch_protection_rule:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 2" # Weekly on Tuesday at 05:23 UTC
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # A read-only admin PAT lets Scorecard fully evaluate Branch-Protection
          # (the default GITHUB_TOKEN cannot read all protection settings). Create
          # a fine-grained PAT with Administration: read + Metadata: read and store
          # it as the `SCORECARD_TOKEN` repo secret. Falls back to GITHUB_TOKEN when
          # the secret is absent, so this change is safe to merge before the secret
          # exists (Branch-Protection just stays under-reported until then).
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
