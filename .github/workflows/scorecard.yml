# OpenSSF Scorecard — continuous evaluation of the repo's security posture.
# https://github.com/ossf/scorecard
name: Scorecard

on:
  branch_protection_rule:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 2" # Weekly on Tuesday at 05:23 UTC
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # A read-only admin PAT lets Scorecard fully evaluate Branch-Protection
          # (the default GITHUB_TOKEN cannot read all protection settings). Create
          # a fine-grained PAT with Administration: read + Metadata: read and store
          # it as the `SCORECARD_TOKEN` repo secret. Falls back to GITHUB_TOKEN when
          # the secret is absent, so this change is safe to merge before the secret
          # exists (Branch-Protection just stays under-reported until then).
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
