# zizmor — static analysis for GitHub Actions workflows.
# https://github.com/woodruffw/zizmor
#
# Catches the exact class of bug behind the TanStack 2026-05-11 incident:
# `pull_request_target` + checkout of fork code, missing permissions blocks,
# unpinned third-party actions, secret leakage via cache, etc.
name: Zizmor

# Path filters: zizmor only inspects files under `.github/workflows`, so any
# change that does not touch a workflow file cannot change its findings.
# The daily schedule still runs against `main` for drift detection.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  schedule:
    - cron: "0 7 * * *" # Daily at 07:00 UTC

permissions: {}

jobs:
  zizmor:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: v1.25.0
