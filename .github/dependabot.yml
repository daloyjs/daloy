# Dependabot keeps GitHub Actions and npm dependencies (incl. workspace
# packages) up to date so we benefit from upstream security fixes quickly
# and so action references can be migrated toward SHA-pinning over time.
#
# See https://docs.github.com/en/code-security/dependabot
#
# Every entry waits one day after a version is published before proposing it
# (cooldown), matching the 24h minimumReleaseAge pnpm enforces on installs:
# most malicious versions are caught and unpublished within hours.
version: 2

updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 1
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: npm
    cooldown:
      default-days: 1
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Pinned to a TypeScript 7-compatible next snapshot until Hey API
      # 0.100.0 ships; stable releases are still on TS 6 and would revert
      # the TS7 migration. Remove alongside the osv-scanner.toml exception.
      - dependency-name: "@hey-api/openapi-ts"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    cooldown:
      default-days: 1
    directory: "/packages/create-daloy"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(create-daloy)"

  - package-ecosystem: npm
    cooldown:
      default-days: 1
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      site-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(site)"
