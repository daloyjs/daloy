# Hardened Deno CI generated by create-daloy --with-ci.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
          disable-sudo: true
          disable-file-monitoring: false

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Install dependencies (frozen lockfile)
        # Deno has no `audit` command, so `deno.lock` is the integrity
        # anchor for this project: `--frozen=true` fails the build when a
        # dependency does not match the committed lockfile, instead of
        # silently resolving something newer than what `osv-scan.yml`
        # actually scanned. This is the Deno counterpart to the Node
        # bundle's `verify:lockfile` gate.
        run: deno install --frozen=true

      - name: Typecheck
        run: deno task typecheck

      - name: Contract check
        # Every route's OpenAPI contract: examples validate against their
        # response schemas, operationIds are present and unique. AGENTS.md
        # makes this a hard rule after any OpenAPI-facing change, so it is
        # a gate here rather than a convention.
        run: deno task contract

      - name: Test
        run: deno task test