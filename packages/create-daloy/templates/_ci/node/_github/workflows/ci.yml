# Hardened CI generated by create-daloy --with-ci.
#
__CI_REQUIRED_CHECKS_NOTE__
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
__CI_NODE_STRATEGY__
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
          disable-sudo: true
          disable-file-monitoring: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

__SETUP_PACKAGE_MANAGER_STEP__

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: __CI_NODE_VERSION__
          # Package-manager caching is intentionally disabled. Shared caches
          # can bridge fork PRs into trusted branches when mis-keyed.

__SETUP_BUN_RUNTIME_STEP__

      - name: Install dependencies
        run: __INSTALL_COMMAND__
        env:
          npm_config_ignore_scripts: "true"

      - name: Verify lockfile sources
        run: __VERIFY_LOCKFILE_COMMAND__

      - name: Typecheck
        run: __TYPECHECK_COMMAND__

__CONTRACT_STEP__

      - name: Test
        run: __TEST_COMMAND__

__BUILD_STEP__

__AUDIT_STEP__