# OpenSSF Scorecard — supply-chain posture score for this repository.
#
# Repository visibility matters here (see SECURITY.md § Prerequisites for the
# scanning workflows):
#   * Scorecard is designed for PUBLIC repositories. Several checks cannot
#     run against a private repo, and publishing to the public OpenSSF
#     dashboard is public-only.
#   * The SARIF upload at the end needs GitHub code scanning, which is free
#     on public repos but requires Advanced Security on private ones.
#
# `publish_results` is therefore OFF by default so a freshly scaffolded
# private repo does not go red on its first push. Once your repo is public
# and you want the OpenSSF badge, add a repository variable
# `SCORECARD_PUBLISH_RESULTS` with the value `true`.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 2"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          show-progress: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repos only — see the header comment.
          publish_results: ${{ vars.SCORECARD_PUBLISH_RESULTS == 'true' }}

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif