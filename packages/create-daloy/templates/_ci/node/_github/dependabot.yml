version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    # Mirror the `minimum-release-age=1440` (24h) setting in `.npmrc`.
    # Dependabot does not read the package manager's release-age config, so
    # without this it would open PRs for versions published minutes ago —
    # putting you back on exactly the early-installer hot path the `.npmrc`
    # comment says you are avoiding. Most npm worm campaigns are detected and
    # unpublished within hours; keep the two numbers in sync if you change
    # either one.
    cooldown:
      default-days: 1
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"

  # Keep the runtime base image (Dockerfile `FROM`) patched. Combined with
  # the `container-scan.yml` workflow, this catches base-image CVEs early.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"