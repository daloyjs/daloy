version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    # Wait a day before proposing a new release, like the npm cooldown.
    cooldown:
      default-days: 1
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    # Mirror the `minimum-release-age=1440` (24h) setting in `.npmrc`.
    # Dependabot does not read the package manager's release-age config, so
    # without this it would open PRs for versions published minutes ago —
    # putting you back on exactly the early-installer hot path the `.npmrc`
    # comment says you are avoiding. Most npm worm campaigns are detected and
    # unpublished within hours; keep the two numbers in sync if you change
    # either one.
    cooldown:
      default-days: 1
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # The Hey API code generator is pinned to a `next` snapshot because
      # the stable line (0.99.x) drives the TypeScript compiler API, which
      # TypeScript 7 removed: on TypeScript 7 `gen:client` crashes. Dependabot
      # would "upgrade" the snapshot to that stable release. Remove this entry
      # once a stable @hey-api/openapi-ts release supports TypeScript 7.
      - dependency-name: "@hey-api/openapi-ts"
    commit-message:
      prefix: "chore(deps)"

  # Keep the runtime base image (Dockerfile `FROM`) patched. Combined with
  # the `container-scan.yml` workflow, this catches base-image CVEs early.
  - package-ecosystem: docker
    directory: "/"
    # Wait a day before proposing a new release, like the npm cooldown.
    cooldown:
      default-days: 1
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"